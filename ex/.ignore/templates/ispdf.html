<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Visualizador de PDF - Python Kivy (Alta Qualidade)</title>
	<style>
		html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		}
		#pdf-container {
		width: 100%;
		height: 100vh;
		display: flex;
		flex-direction: column;
		}
		#pdf-viewer {
		flex: 1;
		width: 100%;
		overflow-y: auto;
		border: none;
		background-color: #f5f5f5;
		}
		.toolbar {
		display: flex;
		justify-content: center;
		align-items: center;
		padding: 10px;
		background-color: #f0f0f0;
		border-bottom: 1px solid #ddd;
		position: sticky;
		top: 0;
		z-index: 100;
		}
		.btn {
		margin: 0 5px;
		padding: 8px 15px;
		background-color: #4285f4;
		color: white;
		border: none;
		border-radius: 4px;
		cursor: pointer;
		font-size: 14px;
		}
		.page-info {
		margin: 0 15px;
		font-family: Arial, sans-serif;
		}
		.loading-message {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		font-family: Arial, sans-serif;
		font-size: 16px;
		color: #666;
		}
		.error-message {
		display: none;
		text-align: center;
		padding: 20px;
		color: #d32f2f;
		font-family: Arial, sans-serif;
		}
		canvas {
		display: block;
		margin: 0 auto;
		border-bottom: 1px solid #ddd;
		}
		/* Adicionado para melhorar visualização em telas de alta resolução */
		@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
		#pdf-viewer canvas {
		image-rendering: -webkit-optimize-contrast;
		image-rendering: crisp-edges;
		}
		}
	</style>
</head>
<body>
	<div id="pdf-container">
		<div class="toolbar">
			<button class="btn" id="prev-btn">Anterior</button>
			<span class="page-info" id="page-info">Página: 0 / 0</span>
			<button class="btn" id="next-btn">Próxima</button>
			<button class="btn" id="zoom-in">Aumentar</button>
			<button class="btn" id="zoom-out">Diminuir</button>
		</div>
		<div id="pdf-viewer"></div>
		<div class="loading-message" id="loading-message">
			Carregando PDF...
		</div>
		<div class="error-message" id="error-message">
			Não foi possível carregar o PDF.
			<a href="pdf2/python-bibliotecas-kivy-app.pdf" download>Clique aqui para baixar</a>
		</div>
	</div>

	<script src="../js/pdf.min.js"></script>
	<script>
		// Configuração da biblioteca PDF.js
		const pdfjsLib = window['pdfjs-dist/build/pdf'];
		pdfjsLib.GlobalWorkerOptions.workerSrc = '../js/pdf.worker.min.js';

		// Elementos da UI
		const pdfViewer = document.getElementById('pdf-viewer');
		const pageInfo = document.getElementById('page-info');
		const prevBtn = document.getElementById('prev-btn');
		const nextBtn = document.getElementById('next-btn');
		const zoomInBtn = document.getElementById('zoom-in');
		const zoomOutBtn = document.getElementById('zoom-out');
		const loadingMessage = document.getElementById('loading-message');
		const errorMessage = document.getElementById('error-message');

		// Variáveis de controle
		let pdfDoc = null;
		let pageNum = 1;
		let pagesRendered = {};

		// Usar escala maior para melhor qualidade
		// Detecta se é dispositivo com tela de alta densidade de pixels
		const isHighDPI = window.devicePixelRatio > 1;
		// Começa com escala maior para melhor qualidade
		let scale = isHighDPI ? 2.0: 1.5;

		// Controles de zoom
		function zoomIn() {
		scale *= 1.2;
		rerenderCurrentPages();
		}

		function zoomOut() {
		scale /= 1.2;
		if (scale < 0.5) scale = 0.5; // Evita zoom excessivo
		rerenderCurrentPages();
		}

		// Adicionar event listeners aos botões de zoom
		zoomInBtn.addEventListener('click', zoomIn);
		zoomOutBtn.addEventListener('click', zoomOut);

		// Função para limpar o visualizador
		function clearViewer() {
		pdfViewer.innerHTML = '';
		pagesRendered = {};
		}

		// Função para renderizar novamente as páginas atuais com nova escala
		function rerenderCurrentPages() {
		clearViewer();
		renderPage(pageNum);
		}

		// Função para renderizar uma página específica com alta qualidade
		function renderPage(num) {
		if (!pdfDoc) return;

		// Garantir que o número da página é válido
		if (num < 1) num = 1;
		if (num > pdfDoc.numPages) num = pdfDoc.numPages;

		pageNum = num;

		// Atualizar informações da página atual
		pageInfo.textContent = `Página: ${pageNum} / ${pdfDoc.numPages}`;

		// Verificar se a página já está renderizada
		if (pagesRendered[pageNum]) {
		// Fazer scroll para a página
		const pageElement = document.getElementById(`page-${pageNum}`);
		if (pageElement) {
		pageElement.scrollIntoView();
		return;
		}
		}

		// Se chegamos aqui, precisamos renderizar a página
		loadingMessage.style.display = 'block';

		// Obter a página
		pdfDoc.getPage(pageNum).then(function(page) {
		// Calcular a escala ideal de acordo com a largura disponível
		const viewport = page.getViewport({ scale: 1.0 });
		const parentWidth = pdfViewer.clientWidth - 20; // Margem

		// Ajustar escala para caber na largura da tela, mas mantendo a qualidade alta
		const baseScale = parentWidth / viewport.width;
		const pixelRatio = window.devicePixelRatio || 1;

		// Usando uma escala composta: baseScale para tamanho na tela + fator de qualidade
		const qualityScale = baseScale * scale;
		const adjustedViewport = page.getViewport({ scale: qualityScale });

		// Preparar canvas com resolução mais alta para melhor qualidade
		const canvas = document.createElement('canvas');
		canvas.id = `page-${pageNum}`;
		canvas.className = 'pdf-page';
		const context = canvas.getContext('2d');

		// Definir dimensões físicas do canvas
		canvas.height = adjustedViewport.height;
		canvas.width = adjustedViewport.width;

		// Definir dimensões de exibição do canvas
		canvas.style.width = `${adjustedViewport.width / (scale * pixelRatio) * pixelRatio}px`;
		canvas.style.height = `${adjustedViewport.height / (scale * pixelRatio) * pixelRatio}px`;

		// Adicionar canvas ao visualizador
		pdfViewer.appendChild(canvas);

		// Renderizar PDF com alta qualidade
		const renderContext = {
		canvasContext: context,
		viewport: adjustedViewport,
		// Habilitar otimizações para renderização de texto
		renderInteractiveForms: true,
		enableWebGL: true
		};

		const renderTask = page.render(renderContext);

		// Finalização da renderização
		renderTask.promise.then(function() {
		loadingMessage.style.display = 'none';
		pagesRendered[pageNum] = true;

		// Verificar se há páginas adjacentes para pré-renderizar
		const preloadNext = pageNum < pdfDoc.numPages ? pageNum + 1: null;
		const preloadPrev = pageNum > 1 ? pageNum - 1: null;

		// Pré-renderizar página seguinte se existir e não estiver renderizada
		if (preloadNext && !pagesRendered[preloadNext]) {
		pdfDoc.getPage(preloadNext).then(function(nextPage) {
		renderPageAtIndex(nextPage, preloadNext);
		});
		}

		// Pré-renderizar página anterior se existir e não estiver renderizada
		if (preloadPrev && !pagesRendered[preloadPrev]) {
		pdfDoc.getPage(preloadPrev).then(function(prevPage) {
		renderPageAtIndex(prevPage, preloadPrev);
		});
		}
		}).catch(function(error) {
		console.error('Erro ao renderizar página:', error);
		errorMessage.style.display = 'block';
		loadingMessage.style.display = 'none';
		});
		});
		}

		// Função auxiliar para renderizar uma página já obtida
		function renderPageAtIndex(page, index) {
		// Calcular a escala ideal de acordo com a largura disponível
		const viewport = page.getViewport({ scale: 1.0 });
		const parentWidth = pdfViewer.clientWidth - 20; // Margem

		// Ajustar escala para caber na largura da tela, mas mantendo a qualidade alta
		const baseScale = parentWidth / viewport.width;
		const pixelRatio = window.devicePixelRatio || 1;

		// Usando uma escala composta: baseScale para tamanho na tela + fator de qualidade
		const qualityScale = baseScale * scale;
		const adjustedViewport = page.getViewport({ scale: qualityScale });

		// Preparar canvas com resolução mais alta para melhor qualidade
		const canvas = document.createElement('canvas');
		canvas.id = `page-${index}`;
		canvas.className = 'pdf-page';
		const context = canvas.getContext('2d');

		// Definir dimensões físicas do canvas
		canvas.height = adjustedViewport.height;
		canvas.width = adjustedViewport.width;

		// Definir dimensões de exibição do canvas
		canvas.style.width = `${adjustedViewport.width / (scale * pixelRatio) * pixelRatio}px`;
		canvas.style.height = `${adjustedViewport.height / (scale * pixelRatio) * pixelRatio}px`;

		// Adicionar canvas ao visualizador na posição correta
		const currentPage = document.getElementById(`page-${pageNum}`);
		if (index > pageNum) {
		// Adicionar depois da página atual
		pdfViewer.appendChild(canvas);
		} else {
		// Adicionar antes da página atual
		pdfViewer.insertBefore(canvas, currentPage);
		}

		// Renderizar PDF com alta qualidade
		const renderContext = {
		canvasContext: context,
		viewport: adjustedViewport,
		// Habilitar otimizações para renderização de texto
		renderInteractiveForms: true,
		enableWebGL: true
		};

		const renderTask = page.render(renderContext);

		// Finalização da renderização
		renderTask.promise.then(function() {
		pagesRendered[index] = true;
		}).catch(function(error) {
		console.error(`Erro ao renderizar página ${index}:`, error);
		});
		}

		// Ir para página anterior
		function onPrevPage() {
		if (pageNum <= 1) return;
		pageNum--;

		// Atualizar informações da página atual
		pageInfo.textContent = `Página: ${pageNum} / ${pdfDoc.numPages}`;

		// Fazer scroll para a página
		const pageElement = document.getElementById(`page-${pageNum}`);
		if (pageElement) {
		pageElement.scrollIntoView({ behavior: 'smooth' });
		} else {
		// Se a página ainda não foi renderizada, renderizamos ela
		renderPage(pageNum);
		}
		}

		// Ir para próxima página
		function onNextPage() {
		if (pageNum >= pdfDoc.numPages) return;
		pageNum++;

		// Atualizar informações da página atual
		pageInfo.textContent = `Página: ${pageNum} / ${pdfDoc.numPages}`;

		// Fazer scroll para a página
		const pageElement = document.getElementById(`page-${pageNum}`);
		if (pageElement) {
		pageElement.scrollIntoView({ behavior: 'smooth' });
		} else {
		// Se a página ainda não foi renderizada, renderizamos ela
		renderPage(pageNum);
		}
		}

		// Adicionar event listeners aos botões
		prevBtn.addEventListener('click', onPrevPage);
		nextBtn.addEventListener('click', onNextPage);

		// Carregar o documento PDF
		const pdfUrl = 'pdf2/python-bibliotecas-kivy-app.pdf';

		pdfjsLib.getDocument({
		url: pdfUrl,
		// Configurações para melhorar a qualidade
		cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/cmaps/',
		cMapPacked: true
		}).promise.then(function(pdfDoc_) {
		pdfDoc = pdfDoc_;
		console.log('PDF carregado com sucesso. Total de páginas:', pdfDoc.numPages);

		// Atualizar informações da página
		pageInfo.textContent = `Página: ${pageNum} / ${pdfDoc.numPages}`;

		// Renderizar a primeira página
		renderPage(pageNum);
		}).catch(function(error) {
		console.error('Erro ao carregar o documento:', error);
		errorMessage.style.display = 'block';
		loadingMessage.style.display = 'none';
		});

		// Responder a alterações no tamanho da tela
		window.addEventListener('resize', function() {
		// Recarregar o PDF com as novas dimensões
		if (pdfDoc) {
		clearViewer();
		renderPage(pageNum);
		}
		});
	</script>
</body>
</html>
